[project]
name = "textreader-api"
version = "0.1.0"
description = "Local neural text-to-speech server for reading web articles aloud"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mlx-audio>=0.4.8",
    "misaki[en]>=0.9.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "soundfile>=0.12",
    "num2words>=0.5.13",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
torch = ["kokoro>=0.9.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
